<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Unbounded';src:url(../assets/unbounded-latin.woff2) format('woff2');font-weight:400 900;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#090A08;font-family:Inter,sans-serif;color:#fff;overflow:hidden}
#c{position:relative;overflow:hidden;background:radial-gradient(900px 600px at 30% 40%,rgba(234,255,0,.16),transparent 70%),radial-gradient(900px 700px at 85% 80%,rgba(46,166,255,.20),transparent 70%),#090A08}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1.2px,transparent 1.3px);background-size:32px 32px}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(234,255,0,.16)}
.kick{font-family:'JetBrains Mono';font-weight:700;letter-spacing:.18em;color:#EAFF00;display:flex;align-items:center;gap:12px}
.kick i{width:12px;height:12px;border-radius:3px;background:#EAFF00}
h1{font-family:Unbounded;font-weight:800;letter-spacing:-.03em;line-height:1.02}
h1 em{font-style:normal;color:#EAFF00}
.sub{color:#C4C9C0;font-weight:500;line-height:1.4}
.row{display:flex;align-items:center;gap:16px;background:#141617;border:1px solid #2A2E31;border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.row.hl{border-color:#EAFF00;box-shadow:0 0 0 2px #EAFF00,0 30px 60px rgba(0,0,0,.6)}
.row .nm{font-weight:700}
.row .tag{margin-left:auto;font-family:'JetBrains Mono';font-weight:700;color:#2EA6FF;background:rgba(46,166,255,.12);border:1px solid rgba(46,166,255,.4);border-radius:999px}
.url{font-family:'JetBrains Mono';font-weight:700;background:#EAFF00;color:#12140F;border-radius:999px;display:inline-block}
.logo{position:relative;display:inline-block}
.logo .chk{position:absolute;right:-6%;bottom:-6%;width:38%;height:38%}
</style></head><body><div id="c"></div>
<script>
const SQ=(()=>{const p=[];for(let i=0;i<360;i+=3){const a=i*Math.PI/180,c=Math.cos(a),s=Math.sin(a);p.push(`${(50+50*Math.sign(c)*Math.pow(Math.abs(c),.4)).toFixed(2)},${(50+50*Math.sign(s)*Math.pow(Math.abs(s),.4)).toFixed(2)}`)}return 'M'+p.join(' L')+'Z'})();
const MARK=`<path d="M21.5,38.6 L75.2,24.6 L61.4,79 Q53.4,63 53.6,50.2 L63.4,38.8 L47,48.4 Q31.5,51.5 21.5,38.6 Z" fill="#0B0B0B" stroke="#0B0B0B" stroke-width="5.5" stroke-linejoin="round"/><path d="M53.6,50.2 L63.4,38.8" stroke="#EAFF00" stroke-width="2.2" stroke-linecap="round"/><circle cx="40.3" cy="60" r="5.6" fill="#0B0B0B"/>`;
const CHK=`<svg class="chk" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#2EA6FF" stroke="#090A08" stroke-width="4"/><path d="M12 20.5 L17.5 26 L28.5 14.5" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOGO=s=>`<span class="logo" style="width:${s}px;height:${s}px"><svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="${SQ}" fill="#EAFF00"/>${MARK}</svg>${CHK}</span>`;
const small=s=>`<span class="logo" style="width:${s}px;height:${s}px;flex:none"><svg width="${s}" height="${s}" viewBox="0 0 100 100"><path d="${SQ}" fill="#EAFF00"/>${MARK}</svg>${CHK}</span>`;
const q=new URLSearchParams(location.search), W=+q.get('w'), Hh=+q.get('h'), sq=W===Hh;
const c=document.getElementById('c'); c.style.width=W+'px'; c.style.height=Hh+'px';
const row=(n,hl,s)=>`<div class="row ${hl?'hl':''}" style="padding:${s*.7}px ${s}px;font-size:${s*1.15}px;margin-bottom:${s*.6}px;opacity:${hl?1:.5}">${hl?small(s*2.1):`<span style="width:${s*2.1}px;height:${s*2.1}px;border-radius:${s*.5}px;background:${n[1]};flex:none"></span>`}<span class="nm">${n[0]}</span>${hl?`<span class="tag" style="font-size:${s*.8}px;padding:${s*.3}px ${s*.7}px">✓ VERIFIED</span>`:''}</div>`;
if(!sq){
 c.innerHTML=`<div class="grid"></div><div class="ring" style="width:900px;height:900px;left:-250px;top:-160px"></div><div class="ring" style="width:1300px;height:1300px;left:-450px;top:-360px;border-style:dashed;opacity:.6"></div>
 <div style="position:absolute;left:110px;top:120px;width:860px">
  <div class="kick" style="font-size:20px;margin-bottom:34px"><i></i>POLYMARKET BUILDERS</div>
  <div style="margin-bottom:40px">${LOGO(150)}</div>
  <h1 style="font-size:84px">GramFi is now<br><em>verified</em> on<br>Polymarket</h1>
  <div class="sub" style="font-size:28px;margin-top:30px;max-width:720px">Polymarket bets, right inside Telegram.</div>
  <div class="url" style="font-size:26px;padding:12px 28px;margin-top:38px">gramfi.ai</div></div>
 <div style="position:absolute;right:110px;top:250px;width:520px;transform:perspective(1400px) rotateY(-14deg) rotateX(4deg)">
  ${row(['Builder',''],0,20).replace('Builder','<span style="opacity:.6">Projects</span>')}
  ${row(['PolyTracer','#5B8DEF'],0,20)}${row(['GramFi',''],1,26)}${row(['Predictwise','#9B7BFF'],0,20)}${row(['Questflow.ai','#3FBF8F'],0,20)}</div>`;
}else{
 c.innerHTML=`<div class="grid"></div><div class="ring" style="width:860px;height:860px;left:110px;top:-120px"></div><div class="ring" style="width:1200px;height:1200px;left:-60px;top:-290px;border-style:dashed;opacity:.6"></div>
 <div style="position:absolute;left:0;right:0;top:100px;text-align:center">
  <div class="kick" style="font-size:20px;justify-content:center;margin-bottom:40px"><i></i>POLYMARKET BUILDERS</div>
  ${LOGO(200)}
  <h1 style="font-size:80px;margin-top:46px">GramFi is now<br><em>verified</em> on Polymarket</h1>
  <div class="sub" style="font-size:28px;margin:28px auto 0;max-width:780px">Polymarket bets, right inside Telegram.</div>
  <div style="width:560px;margin:46px auto 0;text-align:left">${row(['GramFi',''],1,26)}</div>
  <div class="url" style="font-size:26px;padding:12px 28px;margin-top:22px">gramfi.ai</div></div>`;
}
</script></body></html>
